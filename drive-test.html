<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动力归位检测 · __SITE__</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230A0A0A'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='700' text-anchor='middle' fill='%23FFC300' font-family='PingFang SC, Noto Sans SC, sans-serif'%3E%E7%BB%9D%3C/text%3E%3C/svg%3E">
    <!--
        站点名常量：改这里即可全站换名（导航 / 页脚 / <title> 全部跟随）。
        SITE.name  = 中文名
        SITE.latin = 拉丁展示字
    -->
    <script>const SITE = { name: "绝顶赵", latin: "JUEDING ZHAO" }; document.title = document.title.replace("__SITE__", SITE.name);</script>
    <style>
        :root {
            --bg: #F4F2EC;
            --surface: #FFFFFF;
            --surface-hover: #F6F4EE;
            --ink: #0A0A0A;
            --ink-2: #6E6E76;
            --ink-3: #A8A8B0;
            --accent: #FFC300;
            --accent-hover: #FFD84D;
            --line: rgba(0, 0, 0, 0.12);
            --radius: 6px;
            --radius-lg: 10px;
            --spring: cubic-bezier(.16, 1, .3, 1);
            --font: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }

        /* ======== 顶部导航（黑色） ======== */
        .topnav {
            position: sticky; top: 0; z-index: 50;
            background: var(--ink);
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        }
        .topnav-inner {
            max-width: 1080px; margin: 0 auto;
            height: 60px; padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
        }
        .topnav-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 0.98em; color: #fff; letter-spacing: -0.01em; }
        .brand-logo {
            width: 28px; height: 28px;
            background: var(--accent); color: var(--ink);
            font-weight: 900; font-size: 1.05em;
            display: flex; align-items: center; justify-content: center;
            border-radius: 2px;
        }
        .topnav-back {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.84em; font-weight: 600; color: rgba(255, 255, 255, 0.72);
            padding: 7px 14px;
            border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 2px;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
        }
        .topnav-back:hover { color: var(--ink); background: var(--accent); border-color: var(--accent); }
        .topnav-back svg { width: 14px; height: 14px; }
        .progress-bar { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--accent); }

        /* ======== 工具页 ======== */
        .tool-main { max-width: 760px; margin: 0 auto; padding: 56px 24px 24px; }
        .tool-hero { text-align: center; padding: 8px 0 36px; }
        .tool-hero-icon {
            width: 60px; height: 60px;
            background: var(--ink); color: var(--accent);
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 2px;
            margin-bottom: 18px;
        }
        .tool-hero-icon svg { width: 28px; height: 28px; }
        .tool-hero h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 12px; }
        .tool-hero .sub { font-size: 0.96em; color: var(--ink-2); line-height: 1.8; max-width: 480px; margin: 0 auto; }
        .tool-hero .sub strong {
            font-weight: 900; color: var(--ink);
            background: linear-gradient(transparent 62%, var(--accent) 62%);
            padding: 0 0.06em;
        }

        /* ======== Progress ======== */
        .progress-wrap { margin-bottom: 28px; }
        .progress-info {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85em; font-weight: 700; color: var(--ink-2);
            margin-bottom: 8px;
        }
        .progress-info .current {
            color: var(--ink); font-weight: 900;
            background: var(--accent);
            padding: 2px 9px; border-radius: 2px;
        }
        .progress-bar-track { height: 6px; background: rgba(0, 0, 0, 0.1); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }

        /* ======== Question Card ======== */
        .question-card {
            background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--radius);
            padding: 28px 24px 24px;
            margin-bottom: 16px;
        }
        .question-card.animate-in { animation: fadeSlideUp 0.35s ease; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .q-number {
            font-size: 0.78em; font-weight: 800; color: var(--ink);
            background: var(--accent);
            display: inline-block; padding: 4px 12px; border-radius: 2px;
            margin-bottom: 14px;
        }
        .q-dimension { font-size: 0.72em; color: var(--ink-2); margin-left: 8px; display: inline-block; font-weight: 600; }
        .q-text { font-size: 1.08em; font-weight: 600; line-height: 1.7; margin-bottom: 24px; }

        /* ======== Options ======== */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px;
            background: var(--surface);
            border: 1.5px solid var(--line); border-radius: var(--radius);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
        }
        .option:hover { border-color: var(--ink); background: var(--surface-hover); }
        .option.selected { border-color: var(--ink); background: var(--accent); }
        .option .radio {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .option.selected .radio { border-color: var(--ink); background: var(--ink); }
        .option.selected .radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
        .option .opt-label { flex: 1; font-size: 0.92em; font-weight: 400; line-height: 1.6; }

        /* ======== Result ======== */
        .result-section { display: none; animation: fadeSlideUp 0.4s ease; }
        .result-section.show { display: block; }
        .result-card {
            background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--radius-lg);
            padding: 28px 24px;
            margin-bottom: 16px;
        }
        .result-badge {
            display: inline-block; font-size: 0.82em; font-weight: 800;
            padding: 6px 16px; border-radius: 2px; margin-bottom: 16px;
        }
        .result-title { font-size: 1.3em; font-weight: 900; margin-bottom: 12px; line-height: 1.4; }
        .result-score { font-size: 0.88em; color: var(--ink-2); margin-bottom: 20px; }
        .result-score strong { color: var(--ink); font-size: 1.2em; }
        .result-desc { font-size: 0.92em; line-height: 1.85; color: #4A4A52; margin-bottom: 16px; }
        .result-desc p { margin-bottom: 12px; }
        .result-solution { font-size: 0.92em; line-height: 1.85; color: #4A4A52; }
        .result-solution p { margin-bottom: 8px; }

        /* Result color variants */
        .result-driver .result-badge { background: rgba(34, 197, 94, 0.14); color: #16A34A; }
        .result-driver .result-title { color: #16A34A; }
        .result-passenger .result-badge { background: rgba(234, 179, 8, 0.16); color: #B45309; }
        .result-passenger .result-title { color: #B45309; }
        .result-complaint .result-badge { background: rgba(239, 68, 68, 0.14); color: #DC2626; }
        .result-complaint .result-title { color: #DC2626; }

        .retry-wrap { text-align: center; margin-top: 12px; }
        .retry-btn {
            background: none; border: 1.5px solid var(--ink);
            color: var(--ink-2);
            padding: 10px 24px; border-radius: 2px;
            font-size: 0.85em; font-family: var(--font); font-weight: 700; cursor: pointer;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
        }
        .retry-btn:hover { color: #fff; background: var(--ink); }

        /* ======== 页脚（黑色） ======== */
        .footer {
            background: var(--ink);
            margin-top: 40px;
            padding: 56px 24px 60px; text-align: center;
            border-top: none;
        }
        .footer p { font-size: 0.8em; color: rgba(255, 255, 255, 0.55); line-height: 2; }
        .footer p:first-child { color: rgba(255, 255, 255, 0.78); font-weight: 600; }

        /* ======== 动效 ======== */
        .reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.55s ease, transform 0.55s var(--spring); }
        .reveal.in { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .reveal { opacity: 1; transform: none; }
        }

        /* ======== 响应式 ======== */
        @media (max-width: 640px) {
            .topnav-inner { padding: 0 16px; }
            .tool-main { padding: 40px 16px 16px; }
            .question-card { padding: 22px 18px 20px; border-radius: var(--radius); }
            .q-text { font-size: 1em; }
            .option { padding: 12px 14px; gap: 12px; }
            .option .opt-label { font-size: 0.88em; }
            .result-card { padding: 22px 18px; }
            .result-title { font-size: 1.15em; }
        }
        @media (max-width: 360px) {
            .retry-btn { font-size: 0.8em; padding: 8px 20px; }
        }
        @media (min-width: 768px) {
            .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
            .option { padding: 16px 20px; }
            .result-card { padding: 36px 32px; }
            .result-title { font-size: 1.5em; }
            .result-badge { font-size: 0.88em; padding: 8px 20px; }
            .result-desc { font-size: 1em; }
            .result-solution { font-size: 1em; }
            .retry-btn { font-size: 0.9em; padding: 12px 28px; }
        }
    </style>
</head>
<body>

    <!-- ======== 顶部导航 ======== -->
    <nav class="topnav">
        <div class="progress-bar" id="progress-bar"></div>
        <div class="topnav-inner">
            <a class="topnav-brand" href="index.html">
                <span class="brand-logo">绝</span>
                <span data-site-name>绝顶赵</span>
            </a>
            <a class="topnav-back" href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                返回首页
            </a>
        </div>
    </nav>

    <!-- ======== 工具页 ======== -->
    <main class="tool-main">

        <header class="tool-hero reveal">
            <div class="tool-hero-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
            </div>
            <h1>动力归位检测</h1>
            <p class="sub">
                这不是一个给你打分的心理测试，而是一面照见你真实内心的镜子。
                <strong>10道题</strong>，帮你搞清楚：你到底是自己人生的司机，还是乘客？
            </p>
        </header>

        <!-- ======== Progress ======== -->
        <div class="progress-wrap reveal">
            <div class="progress-info">
                <span>进度</span>
                <span><span class="current" id="progress-current">1</span> / 10</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- ======== Question Area ======== -->
        <div id="question-area"></div>

        <!-- ======== Result Area ======== -->
        <div class="result-section" id="result-section">
            <div class="result-card" id="result-card">
                <span class="result-badge" id="result-badge"></span>
                <div class="result-title" id="result-title"></div>
                <div class="result-score" id="result-score"></div>
                <div class="result-desc" id="result-desc"></div>
                <div class="result-solution" id="result-solution"></div>
            </div>
            <div class="retry-wrap">
                <button type="button" id="retry-btn" class="retry-btn">重新测试</button>
            </div>
        </div>

    </main>

    <!-- ======== 页脚 ======== -->
    <footer class="footer">
        <p>本测试基于<span data-site-name>绝顶赵</span>原创《适应性平衡理论》</p>
        <p><span data-site-name>绝顶赵</span> · 个人博客</p>
        <p>基于 MIT-Style with Attribution 协议发布</p>
    </footer>

    <script>
        (function() {
            var questions = [
                {
                    id: 1,
                    text: '你对现在的生活不满意，你经常怎么想？',
                    dimension: '乘客思维',
                    options: [
                        { label: '我得做点什么来改变现状', score: 1 },
                        { label: '要是老板/父母/伴侣能改变就好了', score: 0 },
                        { label: '要是天上能掉馅饼就好了', score: 0 }
                    ]
                },
                {
                    id: 2,
                    text: '遇到困难的时候，你一般怎么处理？',
                    dimension: '乘客思维',
                    options: [
                        { label: '先自己想办法解决', score: 1 },
                        { label: '等着别人来帮我想办法', score: 0 },
                        { label: '抱怨两句，然后放着不管', score: 0 }
                    ]
                },
                {
                    id: 3,
                    text: '看到别人比你过得好，你通常会怎么想？',
                    dimension: '乘客思维',
                    options: [
                        { label: '我也要做点什么让自己变得更好', score: 1 },
                        { label: '人家命好/有背景，比不了', score: 0 },
                        { label: '要是我也有那样的机会就好了', score: 0 }
                    ]
                },
                {
                    id: 4,
                    text: '和人闹矛盾时，你首先想到的是什么？',
                    dimension: '改变对象',
                    options: [
                        { label: '不管谁的错，我能做点什么来改善', score: 1 },
                        { label: '他/她为什么要这样对我', score: 0 },
                        { label: '只要对方先低头，一切就好', score: 0 }
                    ]
                },
                {
                    id: 5,
                    text: '你觉得自己人生最大的问题在哪？',
                    dimension: '改变对象',
                    options: [
                        { label: '我自己的某些习惯和做事方式', score: 1 },
                        { label: '身边的一些人不靠谱', score: 0 },
                        { label: '大环境不好，我能怎么办', score: 0 }
                    ]
                },
                {
                    id: 6,
                    text: '你想要改变一件事，主要是因为什么？',
                    dimension: '动力来源',
                    options: [
                        { label: '我自己受不了了，想活得更舒服', score: 1 },
                        { label: '身边人都这样，不改变会被淘汰', score: 0 },
                        { label: '我想证明给别人看', score: 0 }
                    ]
                },
                {
                    id: 7,
                    text: '如果全世界只剩你一个人，你还会想做你现在想改变的那件事吗？',
                    dimension: '动力来源',
                    options: [
                        { label: '会，那是我真心想要的', score: 1 },
                        { label: '不会，那没什么意义了', score: 0 },
                        { label: '可能会，但动力没那么强了', score: 0 }
                    ]
                },
                {
                    id: 8,
                    text: '做一件事的时候，什么最能让你坚持下去？',
                    dimension: '动力来源',
                    options: [
                        { label: '这件事本身让我有成就感、快乐', score: 1 },
                        { label: '别人的认可和鼓励', score: 0 },
                        { label: '怕做不好被人看不起', score: 0 }
                    ]
                },
                {
                    id: 9,
                    text: '如果改变意味着要放弃一些安全和稳定，你愿意吗？',
                    dimension: '安全感',
                    options: [
                        { label: '愿意，想要更好的生活就得承担风险', score: 1 },
                        { label: '很纠结，既想改变又怕失去现在有的', score: 0 },
                        { label: '不愿意，现在这样就挺安稳的', score: 0 }
                    ]
                },
                {
                    id: 10,
                    text: '下面哪句话最接近你现在的状态？',
                    dimension: '安全感',
                    options: [
                        { label: '我准备好了，该来的总要来', score: 1 },
                        { label: '我也想改变，但现在还不是时候', score: 0 },
                        { label: '就这样吧，折腾来折腾去也没什么意思', score: 0 }
                    ]
                }
            ];

            var results = [
                {
                    min: 8, max: 10,
                    badge: '司机型人格',
                    title: '你已经完成了动力归位',
                    desc: [
                        '恭喜你！你已经完成了动力归位，是自己人生的司机。',
                        '你知道自己想要什么，也愿意为自己的人生负责。你拥有真正的、持久的内驱力，只要用对方法，你一定能够成功改变。'
                    ],
                    sol: [
                        '现在你可以开始使用《适应性平衡理论》的核心方法——一次只改变一件事，抓大放小，稳步前进。',
                        '记住：你的动力来自自己，只要方向正确，没有人能阻止你。'
                    ],
                    cls: 'result-driver'
                },
                {
                    min: 4, max: 7,
                    badge: '乘客型人格',
                    title: '你现在还是人生的乘客',
                    desc: [
                        '你对现状不满，也想要改变，但你内心深处还在等着有一个人、一个机会来拉着你前进。',
                        '你的动力不够稳定，很容易半途而废。你不是做不到，你只是还没有真正把人生的方向盘握在自己手里。'
                    ],
                    sol: [
                        '先不要急着开始改变。花点时间想清楚：如果没有人会来帮你，你自己能做什么来让生活变得好一点点？',
                        '从一件最小的事情开始，拿回人生的主动权。哪怕只是每天早起十分钟，都是在告诉自己：我在为自己而活。'
                    ],
                    cls: 'result-passenger'
                },
                {
                    min: 0, max: 3,
                    badge: '抱怨型人格',
                    title: '你把力量用错了方向',
                    desc: [
                        '你把所有的问题都归罪于别人和环境。你觉得自己的所有不幸都是别人造成的，你不想改变自己，只想改变别人。',
                        '在这种状态下，任何改变都不可能成功——因为你能改变的，从来都只有你自己。'
                    ],
                    sol: [
                        '先停下来，不要再抱怨了。诚实地问自己一个问题：如果所有的人都永远不会改变，我该怎么办？',
                        '当你真正面对这个问题的时候，改变才会开始。你唯一能掌控的，就是你自己。'
                    ],
                    cls: 'result-complaint'
                }
            ];

            var questionArea = document.getElementById('question-area');
            var resultSection = document.getElementById('result-section');
            var progressCurrent = document.getElementById('progress-current');
            var progressFill = document.getElementById('progress-fill');

            var currentQ = 0;
            var answers = new Array(questions.length).fill(null);
            var isAnimating = false;

            function renderQuestion(index) {
                if (index >= questions.length) {
                    showResult();
                    return;
                }

                var q = questions[index];
                var letters = ['A', 'B', 'C'];

                var optionsHtml = '';
                for (var i = 0; i < q.options.length; i++) {
                    var opt = q.options[i];
                    var selected = answers[index] === i ? ' selected' : '';
                    optionsHtml += '<div class="option' + selected + '" data-index="' + i + '">' +
                        '<div class="radio"></div>' +
                        '<span class="opt-label">' + letters[i] + '. ' + opt.label + '</span>' +
                        '</div>';
                }

                var qHtml = document.createElement('div');
                qHtml.className = 'question-card animate-in';
                qHtml.innerHTML =
                    '<div class="q-number">第 ' + (index + 1) + ' 题<span class="q-dimension">' + q.dimension + '</span></div>' +
                    '<div class="q-text">' + q.text + '</div>' +
                    '<div class="options">' + optionsHtml + '</div>';

                questionArea.innerHTML = '';
                questionArea.appendChild(qHtml);

                var opts = qHtml.querySelectorAll('.option');
                opts.forEach(function(opt) {
                    opt.addEventListener('click', function() {
                        if (isAnimating) return;
                        isAnimating = true;

                        var optIdx = parseInt(opt.getAttribute('data-index'));
                        answers[index] = optIdx;

                        opts.forEach(function(o) { o.classList.remove('selected'); });
                        opt.classList.add('selected');

                        updateProgress(index + 1);

                        setTimeout(function() {
                            currentQ++;
                            isAnimating = false;
                            renderQuestion(currentQ);
                        }, 400);
                    });
                });
            }

            function updateProgress(answered) {
                var pct = (answered / questions.length) * 100;
                progressFill.style.width = pct + '%';
                progressCurrent.textContent = Math.min(answered + 1, questions.length);
            }

            function showResult() {
                var total = 0;
                for (var i = 0; i < answers.length; i++) {
                    total += questions[i].options[answers[i]].score;
                }

                var tier = results[results.length - 1];
                for (var i = 0; i < results.length; i++) {
                    if (total >= results[i].min && total <= results[i].max) {
                        tier = results[i];
                        break;
                    }
                }

                questionArea.style.display = 'none';

                var card = document.getElementById('result-card');
                card.className = 'result-card ' + tier.cls;

                document.getElementById('result-badge').textContent = tier.badge;
                document.getElementById('result-title').textContent = tier.title;
                document.getElementById('result-score').innerHTML = '你的得分：<strong>' + total + '</strong> / 10';

                var descHtml = '';
                for (var i = 0; i < tier.desc.length; i++) {
                    descHtml += '<p>' + tier.desc[i] + '</p>';
                }
                document.getElementById('result-desc').innerHTML = descHtml;

                var solHtml = '';
                for (var i = 0; i < tier.sol.length; i++) {
                    solHtml += '<p>' + tier.sol[i] + '</p>';
                }
                document.getElementById('result-solution').innerHTML = solHtml;

                resultSection.classList.add('show');
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            document.getElementById('retry-btn').addEventListener('click', function() {
                currentQ = 0;
                answers = new Array(questions.length).fill(null);
                isAnimating = false;
                resultSection.classList.remove('show');
                questionArea.style.display = 'block';
                progressFill.style.width = '0%';
                renderQuestion(0);
                updateProgress(0);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            renderQuestion(0);
            updateProgress(0);
        })();
    </script>

    <script>
        (function () {
            var named = document.querySelectorAll('[data-site-name], [data-site-latin]');
            for (var i = 0; i < named.length; i++) {
                named[i].textContent = named[i].hasAttribute('data-site-name') ? SITE.name : SITE.latin;
            }

            var bar = document.getElementById('progress-bar');
            function onScroll() {
                if (!bar) return;
                var h = document.documentElement;
                var max = h.scrollHeight - h.clientHeight;
                bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
            }
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();

            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var reveals = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) {
                for (var j = 0; j < reveals.length; j++) reveals[j].classList.add('in');
                return;
            }
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (en.isIntersecting) {
                        en.target.classList.add('in');
                        io.unobserve(en.target);
                    }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
            for (var k = 0; k < reveals.length; k++) {
                reveals[k].style.transitionDelay = Math.min(k * 70, 350) + 'ms';
                io.observe(reveals[k]);
            }
        })();
    </script>
</body>
</html>
